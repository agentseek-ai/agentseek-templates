name: Main

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.9.28"
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: make lock-check lint format-check

  render-and-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.9.28"
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}
      - run: uv sync --frozen --dev
      - run: make test

  core-dependency-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_ASKPASS: /bin/false
      GIT_CONFIG_GLOBAL: /tmp/agentseek-anonymous-gitconfig
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
      GCM_INTERACTIVE: Never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.9.28"
          enable-cache: true
      - run: uv sync --frozen --dev
      - name: Render a template that uses both core contrib packages
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/catalog-core-smoke"
          uv run cookiecutter templates/deepagents/default \
            --no-input \
            --output-dir "${RUNNER_TEMP}/catalog-core-smoke"
      - name: Install generated dependencies from the exact core commit
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/catalog-core-smoke/my_deepagent"
          UV_CACHE_DIR="${RUNNER_TEMP}/generated-clean-cache" uv sync --no-cache
          uv run --project "${GITHUB_WORKSPACE}" python \
            "${GITHUB_WORKSPACE}/scripts/verify_generated_lock.py" \
            "${RUNNER_TEMP}/catalog-core-smoke/my_deepagent/uv.lock"

  public-coordinate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CATALOG_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CATALOG_FULL_NAME: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
      CATALOG_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.clone_url || 'https://github.com/agentseek-ai/agentseek-templates.git' }}
      GIT_ASKPASS: /bin/false
      GIT_CONFIG_GLOBAL: /tmp/agentseek-anonymous-gitconfig
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
      GCM_INTERACTIVE: Never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.9.28"
          enable-cache: true
      - run: uv sync --frozen --dev
      - name: Match a release tag to the catalog release metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "$(jq -r .catalog_release catalog-release.json)"
      - name: Verify the paired core snapshot tag
        run: |
          set -euo pipefail
          core_repository=$(jq -r .core_repository catalog-release.json)
          core_commit=$(jq -r .core_commit catalog-release.json)
          core_release=$(jq -r .core_release catalog-release.json)
          resolved=$(git ls-remote --tags "${core_repository}" "refs/tags/${core_release}^{}" | awk '{print $1}')
          if [ -z "${resolved}" ]; then
            resolved=$(git ls-remote --tags "${core_repository}" "refs/tags/${core_release}" | awk '{print $1}')
          fi
          test "${resolved}" = "${core_commit}"
      - name: Verify the anonymous exact-SHA archive
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 120 \
            --output "${RUNNER_TEMP}/catalog.tar.gz" \
            "https://codeload.github.com/${CATALOG_FULL_NAME}/tar.gz/${CATALOG_COMMIT}"
          tar -tzf "${RUNNER_TEMP}/catalog.tar.gz" | grep -E '/templates/index.json$'
      - name: Exercise list, describe, and create through the public coordinate
        run: |
          set -euo pipefail
          uv run agentseek create --list-templates \
            --template-repo "${CATALOG_REPOSITORY}" \
            --checkout "${CATALOG_COMMIT}"
          uv run agentseek create deepagents/default --describe \
            --template-repo "${CATALOG_REPOSITORY}" \
            --checkout "${CATALOG_COMMIT}"
          mkdir -p "${RUNNER_TEMP}/catalog-create-smoke"
          cd "${RUNNER_TEMP}/catalog-create-smoke"
          uv run --project "${GITHUB_WORKSPACE}" agentseek create deepagents/default --no-input \
            --template-repo "${CATALOG_REPOSITORY}" \
            --checkout "${CATALOG_COMMIT}"
          uv run --project "${GITHUB_WORKSPACE}" python \
            "${GITHUB_WORKSPACE}/scripts/verify_generated_lifecycle.py" \
            "${RUNNER_TEMP}/catalog-create-smoke/my_deepagent"

  rubric-generated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.9.28"
          enable-cache: true
      - run: uv sync --frozen --dev
      - name: Render Rubric Lab
        run: uv run cookiecutter templates/langchain/rubric --no-input --output-dir "${RUNNER_TEMP}/rubric-render"
      - name: Create the keyless server environment
        working-directory: ${{ runner.temp }}/rubric-render/rubric_lab
        run: cp .env.example .env
      - name: Test the rendered Python application and keyless smoke
        working-directory: ${{ runner.temp }}/rubric-render/rubric_lab
        run: |
          uv sync --group test
          uv run python -m pytest -q
          uv run python -m rubric_lab.smoke
      - name: Test and build the rendered frontend
        working-directory: ${{ runner.temp }}/rubric-render/rubric_lab/frontend
        run: |
          npm install
          npm test
          npm run build
      - name: Reject provider credential names from generated production bundle
        working-directory: ${{ runner.temp }}/rubric-render/rubric_lab/frontend
        run: >-
          uv run --project "${GITHUB_WORKSPACE}" python
          "${GITHUB_WORKSPACE}/scripts/verify_generated_frontend_bundle.py" dist
      - name: Validate the rendered lifecycle
        working-directory: ${{ runner.temp }}/rubric-render/rubric_lab
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          uv run --project "${GITHUB_WORKSPACE}" agentseek task rubric-smoke
          uv run --project "${GITHUB_WORKSPACE}" agentseek info
          uv run --project "${GITHUB_WORKSPACE}" agentseek doctor
          uv run --project "${GITHUB_WORKSPACE}" agentseek dev --dry-run

  markdown-messages-generated-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.9.28"
          enable-cache: true
      - run: uv sync --frozen --dev
      - name: Render and install the declared backend dependencies
        run: |
          uv run cookiecutter templates/langchain/markdown-messages --no-input --output-dir "${RUNNER_TEMP}/markdown-render"
          cd "${RUNNER_TEMP}/markdown-render/markdown_messages_agent"
          cp .env.example .env
          sed -i 's/^OPENAI_API_KEY=$/OPENAI_API_KEY=smoke-test-key/' .env
          sed -i 's|^OPENAI_API_BASE=$|OPENAI_API_BASE=http://127.0.0.1:2025/v1|' .env
          sed -i 's/^LANGSMITH_TRACING=true/LANGSMITH_TRACING=false/' .env
          uv sync
      - name: Start the generated backend and exercise the API contract
        working-directory: ${{ runner.temp }}/markdown-render/markdown_messages_agent
        run: |
          set -euo pipefail
          python "${GITHUB_WORKSPACE}/scripts/fake_openai_server.py" > "${RUNNER_TEMP}/fake-openai.log" 2>&1 &
          provider_pid=$!
          uv run agentseek-api dev --port 2024 > "${RUNNER_TEMP}/markdown-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "${api_pid}" "${provider_pid}" || true; cat "${RUNNER_TEMP}/markdown-api.log"; cat "${RUNNER_TEMP}/fake-openai.log"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:2024/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:2024/health > /dev/null
          curl --fail --silent --request POST http://127.0.0.1:2024/assistants/search \
            --header 'content-type: application/json' --data '{"limit": 1}' > assistants.json
          test -s assistants.json
          assistant_id=$(python -c 'import json; print(json.load(open("assistants.json"))[0]["assistant_id"])')
          thread_id=$(curl --fail --silent --request POST http://127.0.0.1:2024/threads --header 'content-type: application/json' --data '{"metadata":{"suite":"markdown-smoke"}}' | python -c 'import json, sys; print(json.load(sys.stdin)["thread_id"])')
          curl --fail --silent --request POST "http://127.0.0.1:2024/threads/${thread_id}/runs" \
            --header 'content-type: application/json' \
            --data "{\"assistant_id\":\"${assistant_id}\",\"input\":{\"message\":\"hello smoke\"}}" > run.json
          run_id=$(python -c 'import json; print(json.load(open("run.json"))["run_id"])')
          curl --fail --silent "http://127.0.0.1:2024/threads/${thread_id}/runs/${run_id}/wait" > run-result.json
          python -c 'import json; assert json.load(open("run-result.json"))["status"] == "success"'

  migrated-local-runtime-matrix:
    name: ${{ matrix.template }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: deepagents/content-builder
            os: ubuntu-latest
            id: content-builder-linux
            database: embedded
          - template: deepagents/mcp
            os: ubuntu-latest
            id: mcp-linux
            database: embedded
          - template: deepagents/mcp
            os: windows-latest
            id: mcp-windows
            database: sqlite
          - template: deepagents/research
            os: ubuntu-latest
            id: research-linux
            database: embedded
          - template: langchain/agentic-rag
            os: ubuntu-latest
            id: agentic-rag-linux
            database: embedded
          - template: langchain/agentic-rag-hybrid
            os: ubuntu-latest
            id: agentic-rag-hybrid-linux
            database: embedded
          - template: langchain/cli-remote
            os: ubuntu-latest
            id: cli-remote-linux
            database: embedded
          - template: langchain/markdown-messages
            os: ubuntu-latest
            id: markdown-messages-linux
            database: embedded
          - template: langchain/rubric
            os: ubuntu-latest
            id: rubric-linux
            database: embedded
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.9.28"
          enable-cache: true
      - run: uv sync --frozen --dev
      - name: Render, install, and exercise the generated lifecycle
        run: >-
          uv run python scripts/generated_runtime_smoke.py
          --template "${{ matrix.template }}"
          --catalog-mode source
          --agentseek-version 0.1.2
          --agentseek-api-version 0.2.3
          --database-mode "${{ matrix.database }}"
          --output-root "${{ runner.temp }}/r/${{ matrix.id }}"
          --proof-output "${{ runner.temp }}/runtime-proof/${{ matrix.id }}.json"
      - name: Upload published-runtime proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-proof-${{ matrix.id }}
          path: ${{ runner.temp }}/runtime-proof/${{ matrix.id }}.json
          if-no-files-found: error
