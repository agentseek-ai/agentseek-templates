name: Context Engineering generated checks

on:
  pull_request:
    paths:
      - "templates/deepagents/context-engineering/**"
      - "templates/index.json"
      - "tests/**"
      - "scripts/verify_generated_lifecycle.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/context-engineering.yml"
  push:
    branches: [main]
    paths:
      - "templates/deepagents/context-engineering/**"
      - "templates/index.json"
      - "tests/**"
      - "scripts/verify_generated_lifecycle.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/context-engineering.yml"

permissions:
  contents: read

jobs:
  generated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.9.28"
          enable-cache: true
          cache-suffix: context-engineering-${{ matrix.python }}
      - run: uv sync --frozen --dev
      - name: Render a custom package name and verify lifecycle v2
        run: |
          uv run --frozen cookiecutter templates/deepagents/context-engineering --no-input \
            --output-dir "${RUNNER_TEMP}/context-render" project_slug=context_ci
          uv run --frozen python scripts/verify_generated_lifecycle.py "${RUNNER_TEMP}/context-render/context_ci"
      - name: Install the shipped lock and run offline application and UI tests
        working-directory: ${{ runner.temp }}/context-render/context_ci
        run: |
          uv sync --frozen --group test
          uv lock --check --offline
          uv run --frozen --group test python -m pytest tests -q
