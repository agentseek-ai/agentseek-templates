[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_name }} evidence-backed rubric revision lab."
authors = [{ name = "{{ cookiecutter.author }}" }]
requires-python = ">=3.12"
dependencies = [
    "deepagents==0.7.1",
    "langchain==1.3.14",
    "langchain-anthropic>=1.3,<2",
    "langchain-google-genai>=4.2,<5",
    "langchain-openai>=1.1,<2",
    "langgraph==1.2.10",
    "langgraph-cli[inmem]>=0.4,<0.5",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
