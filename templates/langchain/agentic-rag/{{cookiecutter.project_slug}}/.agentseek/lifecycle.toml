version = 2
template = "langchain/agentic-rag"
name = "{{ cookiecutter.project_name }}"
description = "LangGraph agentic RAG application with a browser UI and OceanBase seekdb-backed retrieval."
env_file = ".env"
guide = "README.md"

[tools]
required = ["uv", "node", "npm", "docker"]

[paths]
required = [
  "pyproject.toml",
  "langgraph.json",
  "docker-compose.yml",
  "frontend/package.json",
  "frontend/node_modules",
]

[env.AGENTSEEK_MODEL_PROVIDER]
required = true
default = "{{ cookiecutter.default_model_provider }}"
description = "LangChain model provider: openai, anthropic, or google_genai."

[env.AGENTSEEK_MODEL]
required = true
default = "{{ cookiecutter.default_model }}"
description = "Model id passed to LangChain chat model initialization."
aliases = ["BUB_MODEL"]

[env.SEEKDB_HOST]
required = true
default = "127.0.0.1"
description = "seekdb host used by the vector store."

[env.SEEKDB_PORT]
required = true
default = "2881"
description = "seekdb MySQL-compatible port."

[env.SEEKDB_USER]
required = true
default = "root"
description = "seekdb user."

[env.SEEKDB_DB_NAME]
required = true
default = "{{ cookiecutter.seekdb_db_name }}"
description = "seekdb database name."

[env.VECTOR_TABLE_NAME]
required = true
default = "{{ cookiecutter.vector_table_name }}"
description = "Vector table used for ingested documents."

[env.LANGGRAPH_HOST]
required = false
default = "127.0.0.1"
description = "LangGraph dev bind host. Use 0.0.0.0 only on trusted networks."

[env.FRONTEND_HOST]
required = false
default = "127.0.0.1"
description = "Vite frontend bind host. Use 0.0.0.0 only on trusted networks."

[services.seekdb]
name = "OceanBase seekdb"
url = "mysql://127.0.0.1:2881/{{ cookiecutter.seekdb_db_name }}"
kind = "database"
display = "advanced"
description = "Knowledge database containing the documents retrieved by the agent."
tech = "seekdb"
links = { docs = "https://www.oceanbase.ai/docs/" }

[services.backend]
name = "LangGraph API"
url = "http://127.0.0.1:2024"
kind = "api"
display = "advanced"
description = "Agent API served by the LangGraph development runtime."
tech = "langgraph"
links = { docs = "https://docs.langchain.com/oss/python/langgraph/overview", api_docs = "http://127.0.0.1:2024/docs", studio = "https://smith.langchain.com/studio/?baseUrl=http://127.0.0.1:2024" }

[services.frontend]
name = "RAG application"
url = "http://127.0.0.1:{{ cookiecutter.frontend_port }}"
kind = "web"
display = "default"
primary = true
description = "Browser application and normal entry point for asking retrieval-backed questions."
tech = "vite"

[processes.seekdb]
command = ["docker", "compose", "up", "seekdb"]

[processes.backend]
command = ["sh", "-lc", "i=0; until docker compose exec -T seekdb mysql -h127.0.0.1 -P2881 -uroot -e 'SELECT 1'; do i=$((i + 1)); if [ \"$i\" -ge 60 ]; then exit 1; fi; sleep 2; done && uv run langgraph dev --no-browser --host ${LANGGRAPH_HOST:-127.0.0.1}"]

[processes.frontend]
command = ["npm", "run", "dev"]
cwd = "frontend"

[checks.backend]
type = "http"
target = "http://127.0.0.1:2024"
timeout = 2
attempts = 3

[checks.frontend]
type = "http"
target = "http://127.0.0.1:{{ cookiecutter.frontend_port }}"
timeout = 2
attempts = 3

[tasks.sync]
description = "Install Python dependencies."
command = ["uv", "sync"]

[tasks.frontend]
description = "Install frontend dependencies."
command = ["npm", "install", "--prefix", "frontend"]

[tasks.seekdb]
description = "Start the bundled seekdb container."
command = ["docker", "compose", "up", "-d"]
starts = ["seekdb"]

[tasks.seekdb-skills]
description = "Install recommended OceanBase seekdb agent skills."
command = ["npx", "skills", "add", "oceanbase/seekdb-ecology-plugins", "--all"]
