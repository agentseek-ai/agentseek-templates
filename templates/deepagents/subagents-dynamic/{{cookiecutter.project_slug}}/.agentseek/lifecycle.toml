version = 2
template = "deepagents/subagents-dynamic"
name = "{{ cookiecutter.project_name }}"
description = "Six independent Dynamic Subagents patterns with an observable browser lab."
env_file = ".env"
guide = "README.md"

[tools]
required = ["uv", "node", "npm"]

[paths]
required = ["pyproject.toml", "langgraph.json", "examples/routes", "examples/payments", "examples/dead-code-package", "frontend/package.json", "frontend/node_modules"]

[env.AGENTSEEK_MODEL_PROVIDER]
required = true
default = "{{ cookiecutter.default_model_provider }}"
description = "LangChain model provider used by the coordinator and subagents."

[env.AGENTSEEK_MODEL]
required = true
default = "{{ cookiecutter.default_model }}"
description = "Tool-calling model used by the Dynamic Subagents graph."
aliases = ["DEEPAGENTS_MODEL", "BUB_MODEL"]

[env.OPENAI_API_KEY]
required = true
description = "Credential for the selected model provider."
aliases = ["ANTHROPIC_API_KEY", "GOOGLE_API_KEY", "BUB_OPENAI_API_KEY"]

[services.frontend]
name = "Dynamic Pattern Lab"
url = "http://127.0.0.1:{{ cookiecutter.frontend_port }}"
kind = "web"
display = "default"
primary = true
description = "Browser lab for choosing, running, and inspecting six Dynamic Subagents patterns."
links = { docs = "https://docs.langchain.com/oss/python/deepagents/dynamic-subagents" }

[services.langgraph]
name = "LangGraph API"
url = "http://127.0.0.1:{{ cookiecutter.langgraph_port }}"
tech = "langgraph"
kind = "api"
display = "advanced"
primary = false
description = "LangGraph development API serving six isolated Dynamic Subagents assistants."
links = { docs = "https://docs.langchain.com/oss/python/langgraph/overview", api_docs = "http://127.0.0.1:{{ cookiecutter.langgraph_port }}/docs", studio = "https://smith.langchain.com/studio/?baseUrl=http://127.0.0.1:{{ cookiecutter.langgraph_port }}" }

[processes.langgraph]
command = ["uv", "run", "langgraph", "dev", "--port", "{{ cookiecutter.langgraph_port }}", "--no-browser"]

[processes.frontend]
command = ["npm", "run", "dev"]
cwd = "frontend"

[checks.langgraph]
type = "http"
target = "http://127.0.0.1:{{ cookiecutter.langgraph_port }}"
service = "langgraph"
timeout = 2.0
attempts = 3

[checks.frontend]
type = "http"
target = "http://127.0.0.1:{{ cookiecutter.frontend_port }}"
service = "frontend"
timeout = 2.0
attempts = 3

[tasks.sync]
description = "Install Python dependencies with uv."
command = ["uv", "sync", "--extra", "dev"]

[tasks.frontend]
description = "Install frontend dependencies."
command = ["npm", "install", "--prefix", "frontend"]

[tasks.test]
description = "Run the generated Python contract tests."
command = ["uv", "run", "pytest", "-q"]

[tasks.frontend-test]
description = "Run the orchestration UI component tests."
command = ["npm", "test", "--prefix", "frontend"]
