version = 2
template = "deepagents/powercontext"
name = "{{ cookiecutter.project_name }}"
description = "Project release assistant with durable Memory and inspectable bounded recall."
env_file = ".env"
guide = "README.md"

[env.SEEKDB_EMBED]
required = true
default = "true"
description = "Use embedded AgentSeek API checkpoint persistence."

[env.SEEKDB_EMBED_DIR]
required = true
default = "~/.agentseek/{{ cookiecutter.project_slug }}/seekdb"
description = "Embedded AgentSeek API persistence directory."

[env.OCEANBASE_DB_NAME]
required = true
default = "test"
description = "Embedded AgentSeek API database name."

[tools]
required = ["uv", "node", "npm"]

[paths]
required = ["pyproject.toml", "langgraph.json", "frontend/package.json", "frontend/node_modules"]

[env.AGENTSEEK_MODEL_PROVIDER]
required = true
default = "{{ cookiecutter.default_model_provider }}"
description = "LangChain model provider."

[env.AGENTSEEK_MODEL]
required = true
default = "{{ cookiecutter.default_model }}"
description = "Model id used by the powercontext graph."
aliases = ["DEEPAGENTS_MODEL", "BUB_MODEL"]

[env.OPENAI_API_KEY]
required = true
description = "Credential for the selected model provider."
aliases = ["ANTHROPIC_API_KEY", "GOOGLE_API_KEY", "BUB_OPENAI_API_KEY"]

[env.POWERCONTEXT_URL]
required = true
default = "{{ cookiecutter.powercontext_url }}"
description = "URL of the local PowerContext Server used for bounded context preparation."

[env.POWERCONTEXT_SCOPE_ID]
required = false
default = "{{ cookiecutter.powercontext_scope }}"
description = "Optional existing Server-owned Scope ID; otherwise initialize project memory in the UI."

[env.POWERCONTEXT_SERVER_DATABASE_KIND]
required = true
default = "seekdb"
description = "PowerContext Server storage backend; seekdb runs embedded locally."

[env.POWERCONTEXT_SERVER_DATABASE_PATH]
required = true
default = "~/.agentseek/{{ cookiecutter.project_slug }}/powercontext-seekdb"
description = "PowerContext Memory database directory, separate from AgentSeek API checkpoints."

[env.POWERCONTEXT_PROJECT_KEY]
required = true
default = "{{ cookiecutter.project_slug }}"
description = "Stable project binding; choose a different key for independent projects."

[env.POWERCONTEXT_MAX_BYTES]
required = true
default = "{{ cookiecutter.powercontext_max_bytes }}"
description = "Maximum UTF-8 bytes returned in one PreparedContext."

[services.langgraph]
name = "AgentSeek API"
url = "http://127.0.0.1:{{ cookiecutter.langgraph_port }}"
tech = "agentseek-api"
kind = "api"
display = "advanced"
primary = false
description = "AgentSeek API runtime that runs the Deep Agents powercontext graph."
links = { docs = "https://docs.langchain.com/oss/python/langgraph/overview", api_docs = "http://127.0.0.1:{{ cookiecutter.langgraph_port }}/docs", studio = "https://smith.langchain.com/studio/?baseUrl=http://127.0.0.1:{{ cookiecutter.langgraph_port }}" }

[services.frontend]
name = "PowerContext application"
url = "http://127.0.0.1:{{ cookiecutter.frontend_port }}"
kind = "web"
display = "default"
primary = true
description = "Projection-aware Event Streaming browser UI."
tech = "vite"
links = { docs = "https://vite.dev/guide/" }

[processes.langgraph]
command = ["uv", "run", "agentseek-api", "dev", "--port", "{{ cookiecutter.langgraph_port }}"]

[processes.frontend]
command = ["npm", "run", "dev"]
cwd = "frontend"

[checks.langgraph]
type = "http"
target = "http://127.0.0.1:{{ cookiecutter.langgraph_port }}/health"
service = "langgraph"
timeout = 2
attempts = 3

[checks.frontend]
type = "http"
target = "http://127.0.0.1:{{ cookiecutter.frontend_port }}"
service = "frontend"
timeout = 2
attempts = 3

[tasks.sync]
description = "Install Python dependencies with uv."
command = ["uv", "sync"]

[tasks.frontend]
description = "Install frontend dependencies."
command = ["npm", "install", "--prefix", "frontend"]

[tasks.powercontext]
description = "Reuse or start the local PowerContext Server."
command = ["uv", "run", "python", "scripts/ensure_powercontext.py"]
