[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_name }} — DeepAgents MCP Tools application."
authors = [{ name = "{{ cookiecutter.author }}" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents==0.7.8",
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-mcp-adapters>=0.3,<0.4",
    "langchain-openai>=0.3",
    "python-dotenv>=1.0",
    "starlette>=0.27",
    "agentseek-api[embedded]==0.2.3",
    "pyobvector[pyseekdb]",
    "mcp>=1.27.1,<2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest==9.1.1"]
